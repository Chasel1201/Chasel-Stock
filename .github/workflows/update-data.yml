name: Update options chip data

on:
  schedule:
    # 選擇權籌碼：台北時間下午3點（UTC 07:00），這是你先前指定的時間
    - cron: '0 7 * * 1-5'
    # 個股籌碼（大戶/外資持股比）：台北時間下午4點半（UTC 08:30），外資持股比公布較晚
    - cron: '30 8 * * 1-5'
    # 盤後雷達（產業資金流向＋強勢股）：台北時間下午4點40分（UTC 08:40），晚上6點10分（UTC 10:10）再補跑一次，避免資料源晚更新
    - cron: '40 8 * * 1-5'
    - cron: '10 10 * * 1-5'
    # 盤後雷達補跑：GitHub 排程常延遲或漏跑，多排幾個避開整點的時間（台北 16:19、17:47、19:29）
    - cron: '19 8 * * 1-5'
    - cron: '47 9 * * 1-5'
    - cron: '29 11 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-options-data:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 7 * * 1-5' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取選擇權籌碼資料
        run: python fetch_data.py
      - name: 提交 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "自動更新選擇權籌碼資料 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "推送衝突，重試第 $i 次..."
            sleep 5
          done

  update-stock-chips:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 8 * * 1-5' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取個股籌碼資料（大戶持股比／外資持股比）
        run: python fetch_stock_chips.py
      - name: 提交 stocks.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks.json
          git diff --quiet --cached || git commit -m "自動更新個股籌碼資料 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "推送衝突，重試第 $i 次..."
            sleep 5
          done

  update-flow-radar:
    runs-on: ubuntu-latest
    if: contains(fromJSON('["40 8 * * 1-5","10 10 * * 1-5","19 8 * * 1-5","47 9 * * 1-5","29 11 * * 1-5"]'), github.event.schedule) || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取盤後產業資金流向與強勢股
        run: python fetch_flow.py
      - name: 提交 flow/flow.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flow/flow.json flow/history.json
          git diff --quiet --cached || git commit -m "自動更新盤後雷達資料 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "推送衝突，重試第 $i 次..."
            sleep 5
          done
